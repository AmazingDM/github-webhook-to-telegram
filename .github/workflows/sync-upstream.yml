name: Sync Upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'AmazingDM/github-webhook-to-telegram'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/AmazingDM/github-webhook-to-telegram.git
          git fetch upstream main:refs/remotes/upstream/main

      - name: Sync main
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream/main."
            exit 0
          fi

          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
            git push origin HEAD:main
            exit 0
          fi

          echo "Fork main has commits that are not in upstream/main; refusing to overwrite." >&2
          echo "Resolve manually, then rerun this workflow." >&2
          exit 1
